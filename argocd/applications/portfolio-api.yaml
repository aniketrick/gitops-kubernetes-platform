apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/aniketrick/gitops-kubernetes-platform.git
    targetRevision: main
    path: helm/portfolio-api

  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-api

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
