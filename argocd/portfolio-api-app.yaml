apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/gitops-kubernetes-platform.git
    targetRevision: HEAD
    path: helm/portfolio-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
